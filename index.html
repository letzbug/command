   wrap.style.cssText='font:15px/1.55 system-ui,sans-serif;padding:28px;max-width:820px;margin:35px auto;background:#fff;color:#1b2940;border:1px solid #dae2ea;border-radius:12px;box-shadow:0 6px 28px #0001';

   var msg=document.createElement('p');msg.textContent='Envoyez une capture de cette erreur à Cameron. Les données locales ne sont pas supprimées.';wrap.appendChild(msg);

})();
