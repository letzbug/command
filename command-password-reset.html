<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><meta http-equiv="Cache-Control" content="no-store">
<title>UniPop COMMAND — Mot de passe oublié</title>
<style>
:root{font-family:Montserrat,system-ui,-apple-system,'Segoe UI',sans-serif;color:#15223a;background:#f1f4f9;color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.card{background:#fff;border:1px solid #dce4ef;border-radius:17px;box-shadow:0 12px 38px #172a4410;max-width:440px;width:100%;padding:32px}header{margin-bottom:24px}small{font-weight:800;letter-spacing:.12em;color:#59708f;font-size:11px}h1{font-size:25px;line-height:1.2;margin:12px 0 9px}p{line-height:1.5;color:#586980;font-size:14px}label{display:block;margin:20px 0 7px;font-size:13px;font-weight:700}input{width:100%;border:1px solid #c5d1e0;border-radius:8px;font:inherit;font-size:15px;padding:12px}button{width:100%;margin-top:21px;border:0;background:#1d5ec9;color:white;padding:13px;border-radius:8px;font:inherit;font-weight:750;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.notice{margin-top:20px;padding:12px;border-radius:8px;font-size:13px;line-height:1.45;background:#eef3fa;white-space:pre-wrap;overflow-wrap:anywhere}.notice.error{background:#fceceb;color:#962a26}.notice.good{background:#e9f5ed;color:#195b37}.hidden{display:none}footer{margin-top:24px;color:#708097;font-size:11px;text-align:center}.hint{font-size:12px;color:#64748b;margin-top:8px}
</style>
</head>
<body><main class="card">
<header><small>UNIPOP COMMAND</small><h1>Réinitialiser le mot de passe</h1><p id="subtitle">Saisissez votre adresse e-mail pour recevoir un lien de réinitialisation.</p></header>
<section id="request"><form id="request-form"><label for="email">E-mail professionnel</label><input id="email" type="email" autocomplete="email" required placeholder="prenom.nom@men.lu"><button id="send" type="submit">Recevoir le lien</button></form></section>
<section id="change" class="hidden"><form id="change-form"><label for="password">Nouveau mot de passe</label><input id="password" type="password" minlength="12" autocomplete="new-password" required><div class="hint">12 caractères minimum ; choisissez un mot de passe unique.</div><label for="confirm">Confirmer le mot de passe</label><input id="confirm" type="password" minlength="12" autocomplete="new-password" required><button id="save" type="submit">Enregistrer mon nouveau mot de passe</button></form></section>
<div id="notice" class="notice hidden" role="status" aria-live="polite"></div><footer>UniPop COMMAND · Compte personnel · Connexion sécurisée Supabase</footer>
</main>
<script>
'use strict';
const SUPABASE_URL='https://nhprnkesgjhlqgklzpxu.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_MO7RpWV1Bw1Hk9Ckjp9mHQ_kQmrPjEm';
const $=id=>document.getElementById(id);
let recoveryToken='';
const notice=(message,kind='')=>{const el=$('notice');el.textContent=message;el.className='notice '+kind;};
const apiHeaders={'apikey':SUPABASE_PUBLISHABLE_KEY,'Content-Type':'application/json'};
async function api(path,body,token){
 const response=await fetch(SUPABASE_URL+'/auth/v1/'+path,{method:'POST',headers:{...apiHeaders,...(token?{'Authorization':'Bearer '+token}:{})},body:JSON.stringify(body),cache:'no-store',referrerPolicy:'no-referrer'});
 const data=await response.json().catch(()=>({}));
 if(!response.ok)throw new Error(typeof data.msg==='string'?data.msg:(data.error_description||data.message||data.error||('Erreur HTTP '+response.status)));
 return data;
}
async function updatePassword(password){
 const response=await fetch(SUPABASE_URL+'/auth/v1/user',{method:'PUT',headers:{...apiHeaders,'Authorization':'Bearer '+recoveryToken},body:JSON.stringify({password}),cache:'no-store',referrerPolicy:'no-referrer'});
 const data=await response.json().catch(()=>({}));
 if(!response.ok)throw new Error(data.msg||data.error_description||data.message||data.error||('Erreur HTTP '+response.status));
 return data;
}
function showChange(){
 $('request').classList.add('hidden');$('change').classList.remove('hidden');$('subtitle').textContent='Choisissez un nouveau mot de passe pour votre compte COMMAND.';
 notice('Lien vérifié. Vous pouvez définir votre nouveau mot de passe.','good');
}
(async()=>{
 const fragment=new URLSearchParams(location.hash.slice(1));
 const query=new URLSearchParams(location.search);
 const access=fragment.get('access_token');
 const type=fragment.get('type')||query.get('type');
 const err=fragment.get('error_description')||query.get('error_description')||fragment.get('error');
 // Remove recovery credentials from browser history immediately.
 if(location.hash || location.search) history.replaceState(null,'',location.pathname);
 if(err){notice('Lien invalide ou expiré. Demandez un nouveau lien.','error');return;}
 if(access && type==='recovery'){
   recoveryToken=access;
   showChange();
   return;
 }
 const tokenHash=query.get('token_hash');
 if(tokenHash && type==='recovery'){
   try{
     const data=await api('verify',{token_hash:tokenHash,type:'recovery'});
     if(!data.access_token)throw new Error('Jeton de récupération absent.');
     recoveryToken=data.access_token;showChange();
   }catch(e){notice('Impossible de vérifier ce lien : '+e.message,'error');}
   return;
 }
 if(query.has('code'))notice('Ce lien utilise un autre type de connexion. Demandez un nouveau lien depuis cette page.','error');
})();
$('request-form').addEventListener('submit',async e=>{
 e.preventDefault();const button=$('send');button.disabled=true;
 try{
   // The destination must be an HTTPS webpage registered in Supabase Auth redirect URLs.
   if(location.protocol!=='https:')throw new Error('Cette page doit être ouverte sur une adresse HTTPS publiée, pas comme fichier local.');
   const redirectTo=location.origin+location.pathname;
   await api('recover?redirect_to='+encodeURIComponent(redirectTo),{email:$('email').value.trim()});
   notice('Si un compte existe pour cette adresse, un e-mail de récupération sera envoyé. Vérifiez aussi les courriers indésirables.','good');
 }catch(error){notice('Impossible d’envoyer le lien : '+error.message,'error');}
 finally{button.disabled=false;}
});
$('change-form').addEventListener('submit',async e=>{
 e.preventDefault();const p=$('password').value;const c=$('confirm').value;
 if(p.length<12){notice('Utilisez au moins 12 caractères.','error');return;}
 if(p!==c){notice('Les deux mots de passe ne correspondent pas.','error');return;}
 const button=$('save');button.disabled=true;
 try{
   await updatePassword(p);
   recoveryToken='';$('change').classList.add('hidden');$('subtitle').textContent='Votre mot de passe a été changé.';
   $('password').value='';$('confirm').value='';
   notice('Mot de passe mis à jour. Retournez dans UniPop COMMAND et connectez-vous avec votre nouveau mot de passe.','good');
 }catch(error){notice('Échec de la mise à jour : '+error.message,'error');}
 finally{button.disabled=false;}
});
</script></body></html>
